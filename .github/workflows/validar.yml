# Comprueba los datos en cada cambio. Si algo está mal, el cambio sale en rojo.
name: Validar datos
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar fichas, pendientes y enlaces
        run: node scripts/validar.js
