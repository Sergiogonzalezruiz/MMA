<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mapa MMA</title>
<script>try{const t=JSON.parse(localStorage.getItem("mapa-mma-tema"));if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con las tres secciones; cada sección con pestañas Técnicas / Drills / Ruta; fichas con el vídeo arriba */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e3e8e6; --line:#cfd6d3;
  --ink:#16202c; --muted:#5a6672;
  --head-bg:#16202c; --head-fg:#eef1f0;
  --box:#c0392b; --box-soft:#f8e0dc;
  --lu:#9a6400; --lu-soft:#f6ead0;
  --su:#1f3fbf; --su-soft:#dfe5fb;
  --ok:#2f6b4f; --ok-soft:#dcebe3;
  --acc:var(--su); --acc-soft:var(--su-soft);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#171e26; --surface-2:#1f2832; --line:#2c3743;
  --ink:#e7ecef; --muted:#97a3ae; --head-bg:#0a0e13; --head-fg:#e7ecef;
  --box:#ff8a7a; --box-soft:#3a1e1a; --lu:#f0c060; --lu-soft:#3a2e12;
  --su:#8ea4ff; --su-soft:#1f2a55; --ok:#6fc29b; --ok-soft:#173328;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171e26; --surface-2:#1f2832; --line:#2c3743;
  --ink:#e7ecef; --muted:#97a3ae; --head-bg:#0a0e13; --head-fg:#e7ecef;
  --box:#ff8a7a; --box-soft:#3a1e1a; --lu:#f0c060; --lu-soft:#3a2e12;
  --su:#8ea4ff; --su-soft:#1f2a55; --ok:#6fc29b; --ok-soft:#173328;
  color-scheme:dark;
}
[data-sec="boxeo"]{--acc:var(--box);--acc-soft:var(--box-soft)}
[data-sec="lucha"]{--acc:var(--lu);--acc-soft:var(--lu-soft)}
[data-sec="suelo"]{--acc:var(--su);--acc-soft:var(--su-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- Cabecera ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1208px;margin:0 auto;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{font:700 25px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--head-fg);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.bars{display:inline-flex;gap:3px}
.bars i{display:block;width:6px;height:18px;border-radius:2px}
.bars i:nth-child(1){background:var(--box)} .bars i:nth-child(2){background:var(--lu)} .bars i:nth-child(3){background:var(--su)}
nav.main{display:flex;gap:2px}
nav.main a{color:color-mix(in srgb,var(--head-fg) 72%,transparent);text-decoration:none;font:600 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:9px 11px;border-radius:7px;border-bottom:3px solid transparent}
nav.main a:hover{color:var(--head-fg);background:color-mix(in srgb,var(--head-fg) 10%,transparent)}
nav.main a.on{color:var(--head-fg)}
nav.main a.on[data-s="boxeo"]{border-color:var(--box)} nav.main a.on[data-s="lucha"]{border-color:var(--lu)} nav.main a.on[data-s="suelo"]{border-color:var(--su)} nav.main a.on[data-s="plan"],nav.main a.on[data-s="inicio"]{border-color:var(--ok)}
.search{position:relative;flex:1;min-width:0;max-width:380px;margin-left:auto}
.search input{width:100%;border:0;border-radius:8px;padding:9px 12px;background:color-mix(in srgb,var(--head-fg) 14%,var(--head-bg));color:var(--head-fg);font:inherit}
.search input::placeholder{color:color-mix(in srgb,var(--head-fg) 55%,transparent)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgb(0 0 0/.18);max-height:60vh;overflow:auto;padding:6px}
.results a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a.sel{background:var(--surface-2)}
.results small{color:var(--muted)}

/* ---------- Estructura ---------- */
main{max-width:1240px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 clamp(36px,5.5vw,56px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;text-wrap:balance}
h3{font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.eyebrow{font:600 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.crumb{font:600 14px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--acc)}
.lead{max-width:68ch;font-size:17px;margin:14px 0 0}
.muted{color:var(--muted)}
.names{color:var(--muted);margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.names b{font:600 12px/1 var(--display);letter-spacing:.1em;color:var(--muted);margin-right:4px}
.section{margin-top:28px}
.note{background:var(--surface);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:11px 14px;margin-top:18px;max-width:78ch;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:5px;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap}
.chip.acc{background:var(--acc-soft);color:var(--acc)}
.chip.mma{background:var(--box-soft);color:var(--box)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--lu-soft);color:var(--lu)}
a.chip:hover{outline:1px solid currentColor}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:2px solid var(--line);overflow:auto hidden}
.tabs a,.tabs button{border:0;background:none;padding:10px 16px;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-decoration:none;white-space:nowrap}
.tabs .on,.tabs [aria-selected="true"]{color:var(--ink);border-color:var(--acc)}

/* ---------- Listas: una fila por ficha ---------- */
.filas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:8px}
.fila{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:8px 10px 8px 8px;color:var(--ink);transition:border-color .15s}
.fila:hover{border-color:var(--acc)}
.fila[data-e="entrenando"]{border-left-color:var(--lu)}
.fila[data-e="hecha"]{border-left-color:var(--ok)}
.fila .th{width:96px;aspect-ratio:16/9;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fila .th img{display:block;width:100%;height:100%;object-fit:cover}
.tlink{display:block;color:var(--ink);text-decoration:none;font:700 19px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em}
.tlink::after{content:"";position:absolute;inset:0;border-radius:inherit}
.tlink:focus-visible{outline:0}
.tlink:focus-visible::after{outline:2px solid var(--acc);outline-offset:2px}
.meta{color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.frel{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:5px;font-size:13px;line-height:1.3}
.frel b{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.frel a{position:relative;z-index:2;color:var(--ink);text-decoration:none;padding:3px 0}
.frel a:hover{color:var(--acc);text-decoration:underline}
.nums{display:flex;gap:4px;margin-top:4px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 13px/1 var(--display)}
.nums.big{margin-top:0}
.nums.big .num{min-width:40px;height:40px;font-size:22px}
.cuenta{font:500 15px var(--body);color:var(--muted);letter-spacing:0;margin-left:4px}
.tabdesc{color:var(--muted);margin:12px 0 0;max-width:70ch}
.grupos{columns:2 440px;column-gap:14px;margin-top:6px}
.grupos .section{break-inside:avoid;margin:0;padding-top:22px}
.grupos .filas{grid-template-columns:minmax(0,1fr)}

/* ---------- Marcador de estado ---------- */
.mark{position:relative;z-index:2;display:inline-flex;align-items:center;gap:5px;border:0;min-height:32px;padding:4px 10px 4px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:600 13px/1 var(--body);cursor:pointer}
.mark:hover{color:var(--ink)}
.mark svg,.seg svg{width:16px;height:16px;flex:none}
.mark[data-e="entrenando"]{background:var(--lu);color:var(--surface)}
.mark[data-e="hecha"]{background:var(--ok);color:var(--surface)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);margin-right:6px;flex:none;vertical-align:baseline}
.dot[data-e="entrenando"]{border-color:var(--lu);background:var(--lu)}
.dot[data-e="hecha"]{border-color:var(--ok);background:var(--ok)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:7px;font:600 14px/1 var(--body);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.18)}
.seg .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.seg.estado{margin-top:14px}
.seg.estado button{padding:10px 14px;font-size:15px}
.seg.estado button[data-set="entrenando"][aria-pressed="true"]{background:var(--lu);color:var(--surface)}
.seg.estado button[data-set="hecha"][aria-pressed="true"]{background:var(--ok);color:var(--surface)}

/* ---------- Barra de progreso ---------- */
.prog{margin-top:12px;max-width:560px}
.prog .bar{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%}
.prog .bar .h{background:var(--ok)}
.prog .bar .e{background:var(--lu)}
.prog small{display:block;margin-top:5px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sec .prog{margin-top:0;max-width:none}

/* ---------- Filtros ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:18px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vacio{margin-top:18px}

/* ---------- Portada ---------- */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:18px;overflow-x:auto}
.mapbox svg{display:block;width:100%;min-width:640px;height:auto}
.node rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.node text{fill:var(--ink);font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em}
.node .cnt{fill:var(--muted);font:500 13px var(--body);text-transform:none;letter-spacing:0}
.node.link{cursor:pointer}
.node.link:hover rect,.node.link:focus rect{fill:var(--acc-soft);stroke:var(--acc)}
.node.pronto rect{fill:none;stroke:var(--line);stroke-dasharray:5 4}
.node.pronto text{fill:var(--muted)}
.node .band{stroke:none}
.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.sec:hover{border-color:var(--acc)}
.sec h2{margin:0;font-size:32px}
.sec p{margin:0 0 auto;color:var(--muted);font-size:15px;line-height:1.4}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:15px;text-decoration:none;color:var(--ink);font-variant-numeric:tabular-nums}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.solid{background:var(--acc);border-color:var(--acc);color:#fff}
.btn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- Ficha y vídeo ---------- */
.player-wrap{margin-top:20px;background:#000;border-radius:12px 12px 0 0;overflow:hidden}
.player{position:relative;aspect-ratio:16/9;max-width:100%}
.player iframe,.player > div{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;background:#111}
.vmsg a{color:#9fb2ff}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
.vbar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.vbar .lbl{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.vbar .btn{font-size:14px;padding:6px 10px}
.credit{margin-left:auto;color:var(--muted);font-size:14px}
.novideo{margin-top:20px;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.block{margin-bottom:26px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font:700 18px/30px var(--display);text-align:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.err li::marker{color:var(--box)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel + .panel{margin-top:8px}
.panel .k{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.react{display:flex;flex-direction:column;gap:8px}
.react .si{color:var(--muted);font-size:14px}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow .pos{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);text-decoration:none}
.flow .pos small{display:block;font:500 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.linklist a{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;text-decoration:none;color:var(--ink);font-size:15px}
.linklist a:hover{border-color:var(--acc);color:var(--acc)}
.banner{background:var(--lu-soft);color:var(--lu);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:15px}
.banner code{background:color-mix(in srgb,var(--lu) 15%,transparent);padding:1px 5px;border-radius:4px}

/* ---------- Ruta ---------- */
.level{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.level header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.level header h2{margin:0}
.level .que{margin:0 0 12px;max-width:75ch}
.checks{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.checks li::before{content:"";width:8px;height:8px;background:var(--ok);border-radius:50%;margin:8px 0 0 3px}
.jju{display:grid;gap:12px;margin-top:14px}
.jpart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.jpart header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.jcaps{display:flex;flex-wrap:wrap;gap:8px}
.jcap{border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:7px 10px;background:var(--bg);font-size:15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.jcap small{color:var(--muted)}
.jcap a{font-size:14px}
.jcap.prioridad{border-left-color:var(--ok)} .jcap.mantener{border-left-color:var(--su)} .jcap.adaptar{border-left-color:var(--lu)} .jcap.gi{border-left-color:var(--muted);opacity:.75} .jcap.mma{border-left-color:var(--box)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}

/* ---------- Plan ---------- */
.blocks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pblock{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.pblock .min{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.pblock .min small{display:block;font:600 12px var(--display);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.pblock p{margin:4px 0 8px}
.week{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}
.week td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.week tr:first-child td{border-top:0}
.week td:first-child{font:700 17px var(--display);text-transform:uppercase;letter-spacing:.05em;width:120px}

/* ---------- Guía ---------- */
.glayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;margin-top:22px}
.gnav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.gnav a{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:15px}
.gnav a:hover{background:var(--surface-2)}
.gnav a.on{background:var(--ok);color:#fff}
.gnav .sep{height:1px;background:var(--line);margin:8px 4px}
.gbody{min-width:0;max-width:820px}
.gbody h3{margin:26px 0 10px;font-size:21px}
.gbody p,.gbody li{max-width:72ch}
.gbody ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.glead{font-size:17px;margin-top:0}
.gsmall{font-size:14px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%;margin:6px 0}
.tw .gt{margin:0}
.gsteps{margin:0;padding:0;list-style:none;counter-reset:g;display:flex;flex-direction:column;gap:16px}
.gsteps > li{counter-increment:g;position:relative;padding-left:46px;min-height:32px;padding-top:4px}
.gsteps > li::before{content:counter(g);position:absolute;left:0;top:0;font:700 18px/32px var(--display);text-align:center;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff}
.gsteps ul{margin:6px 0}
.gt{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:15px;margin:6px 0}
.gt th,.gt td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.gt thead th{border-top:0;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
code{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.prompt{position:relative;margin:10px 0 4px;background:var(--head-bg);border-radius:10px;padding:30px 14px 12px;color:var(--head-fg)}
.prompt::before{content:attr(data-label);position:absolute;top:8px;left:14px;font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--head-fg) 60%,transparent)}
.prompt pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.prompt .copy{position:absolute;top:6px;right:8px;border:1px solid color-mix(in srgb,var(--head-fg) 30%,transparent);background:transparent;color:var(--head-fg);border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer}
.prompt .copy:hover{background:color-mix(in srgb,var(--head-fg) 12%,transparent)}
.tip{background:var(--ok-soft);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:15px}
.gpager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--ok)}
.gcard strong{font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.gcard span{color:var(--muted);font-size:15px}

/* ---------- Qué falta ---------- */
.huecos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.hueco{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.hueco .big{font:700 22px/1.1 var(--display);margin:4px 0 6px}
.hueco p{margin:0;color:var(--muted);font-size:14px}
.hueco details{margin-top:8px;font-size:14px}
.hueco summary{cursor:pointer;color:var(--ok)}
.hueco ul{margin:6px 0 0;padding-left:18px;max-height:220px;overflow:auto}
.ptable td.pts{font:700 20px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable td small{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 12px}
.filters label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.filters select{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.unrev{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--lu);background:var(--lu-soft);padding:4px 8px;border-radius:5px;text-decoration:none}

/* ---------- Ficha: vídeo fijo y texto al lado ---------- */
.fmain{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.fvideo{position:sticky;top:76px}
.fvideo .player-wrap,.fvideo .novideo{margin-top:0}
.fmore{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px;margin-top:8px}
.fstrip{margin:30px 0}
.fmain .block:last-child{margin-bottom:0}

/* ---------- Progreso ---------- */
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aviso-e{color:var(--box);font-size:14px;margin-top:8px}
.plegable{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.plegable summary{cursor:pointer;font:700 22px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em}
.plegable .filas{margin-top:12px}

/* ---------- Mapa de suelo ---------- */
.mn-acceso{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:16px}
.mn-filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.mn-cats{display:flex;flex-wrap:wrap;gap:6px}
.mn-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:999px;font:600 13px/1 var(--body);cursor:pointer}
.mn-chip[aria-pressed="false"]{color:var(--muted);background:none}
.mn-chip[aria-pressed="false"] i{opacity:.35}
.mn-chip:hover{border-color:var(--acc)}
.mn-modo{margin-left:auto;border:0;background:none;padding:6px 2px;color:var(--acc);font:600 14px var(--body);text-decoration:underline;cursor:pointer}
.c-escape{--c:var(--ok)} .c-guardia{--c:var(--lu)} .c-pase{--c:var(--su)} .c-sumision{--c:var(--box)} .c-mma{--c:var(--ink)}
.mn-p{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted))}
.mn-p.c-mma{background:none;border:2px solid var(--ink)}
.mn-p.vacia{width:18px;border-radius:3px;background:none;border:1px dashed var(--muted)}
.mn-wrap{position:relative;height:min(72vh,720px);min-height:360px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mn{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mn.moviendo{cursor:grabbing}
.mn .e{fill:none;transition:opacity .12s}
.mn .ep{stroke:var(--line);stroke-width:1.2}
.mn .eh{stroke:var(--c);stroke-width:1.5;stroke-dasharray:5 4}
.mn .n{cursor:pointer;outline:0;transition:opacity .12s}
.mn .hit{fill:transparent}
.mn .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.mn .nom{fill:var(--ink);font:700 15px var(--display);text-transform:uppercase;letter-spacing:.03em}
.mn .cnt{fill:var(--muted);font:500 12px var(--body)}
.mn .p.vacia .box{stroke:var(--muted);stroke-dasharray:5 4}
.mn .p.vacia .nom{fill:var(--muted)}
.mn .pt{fill:var(--c);stroke:var(--surface);stroke-width:1.5}
.mn .t.c-mma .pt{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.mn .lbl{fill:var(--ink);font:500 var(--lbl,12px) var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.mn.lejos .lbl{display:none}
.mn.lejos .n.on .lbl{display:inline}
.mn .n.off,.mn .e.off{opacity:.15}
.mn.foco .n:not(.on),.mn.foco .e:not(.on){opacity:.15}
.mn.foco .n.on,.mn.foco .e.on{opacity:1}
.mn .e.on{stroke-width:2.2}
.mn .ep.on{stroke:var(--muted)}
.mn .p:hover .box,.mn .n:focus-visible .box,.mn .sel .box{stroke:var(--acc);stroke-width:3}
.mn .t:hover .pt,.mn .n:focus-visible .pt,.mn .t.sel .pt{stroke:var(--acc);stroke-width:3}
.mn .t:hover .lbl,.mn .n:focus-visible .lbl,.mn .t.sel .lbl{font-weight:600}
.mn-eje{position:absolute;left:4px;top:10px;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 2px;border-radius:4px;font-size:12px;line-height:1;pointer-events:none;white-space:nowrap}
.mn-zoom{position:absolute;left:30px;bottom:10px;display:flex;gap:4px}

.mn-panel{position:fixed;z-index:15;top:calc(58px + env(safe-area-inset-top,0px));right:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgb(0 0 0/.14);overflow:auto;overscroll-behavior:contain;padding:14px 16px 28px}
.mn-panel h2{font-size:28px;margin:0 36px 2px 0}
.mn-panel h3{margin:18px 0 8px}
.mn-panel .chips{margin-top:8px}
.mn-panel .player-wrap{margin-top:12px;border-radius:10px}
.mn-panel .credit{display:block;margin:6px 0 0;font-size:13px}
.mn-panel .seg.estado{display:flex;margin-top:12px}
.mn-panel .seg.estado button{flex:1;justify-content:center;padding:9px 4px;font-size:14px}
.mn-panel .btn.solid{width:100%;justify-content:center;padding:11px;margin-top:16px;font-weight:600}
.mn-panel .btn.solid + .btn{margin-top:8px}
.mn-panel .novideo{margin-top:12px;padding:18px}
.mn-panel .linklist a{font-size:14px;padding:5px 9px}
.mn-panel ol.steps{font-size:15px}
.mn-ruta{margin:10px 0 0;font-size:15px}
.mn-cerrar{position:sticky;top:0;float:right;z-index:2;width:36px;height:36px;margin:-4px -6px 0 0;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.mn-cerrar:hover{color:var(--acc)}
.mn-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;margin-top:12px}
.mn-lista .panel + .panel{margin-top:0}
.mn-lista h3{margin:0 0 8px}
.mn-lista h3 a{color:var(--ink)}
@media (max-width:860px){
  .mn-modo{margin-left:0}
  .mn-panel{top:auto;left:0;right:0;width:auto;z-index:24;bottom:calc(47px + env(safe-area-inset-bottom,0px));max-height:75vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgb(0 0 0/.22)}
}
@media (prefers-reduced-motion:reduce){.mn .e,.mn .n{transition:none}}

/* ---------- Tema y pie ---------- */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border:0;border-radius:8px;background:color-mix(in srgb,var(--head-fg) 14%,var(--head-bg));color:var(--head-fg);cursor:pointer}
.icon-btn:hover{background:color-mix(in srgb,var(--head-fg) 24%,var(--head-bg))}
.icon-btn svg{width:18px;height:18px}
.pie{max-width:1240px;margin:0 auto;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.pie a{color:var(--muted)}
.pie a:hover{color:var(--ink)}

@media (min-width:861px){
  .fbar{position:sticky;top:68px;z-index:10;box-shadow:0 4px 14px rgb(0 0 0/.08)}
}

@media (max-width:860px){
  .glayout{grid-template-columns:minmax(0,1fr);gap:14px}
  .gnav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .gnav a{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .gnav .sep{display:none}
  .secs{grid-template-columns:minmax(0,1fr)}
  .fmain{grid-template-columns:minmax(0,1fr);gap:22px}
  .fvideo{position:static}
  .credit{margin-left:0;width:100%}
  .top-in{flex-wrap:nowrap}
  .search{max-width:none;margin-left:0}
  nav.main{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--head-bg);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.main a{padding:15px 2px;font-size:15px;letter-spacing:.03em;text-align:center;border-radius:0;border-bottom:0;border-top:3px solid transparent}
  body{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px))}
  .brand span.t{display:none}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  <div class="top-in">
    <a class="brand" href="#inicio"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="t">Mapa MMA</span></a>
    <nav class="main" id="nav" aria-label="Secciones">
      <a href="#inicio" data-s="inicio">Inicio</a>
      <a href="#boxeo" data-s="boxeo">Boxeo</a>
      <a href="#lucha" data-s="lucha">Lucha</a>
      <a href="#suelo" data-s="suelo">Suelo</a>
      <a href="#plan" data-s="plan">Plan</a>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar: jab, sprawl, mataleón…" autocomplete="off" aria-label="Buscar">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="icon-btn" id="tema" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro u oscuro"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </div>
</header>

<main id="main"></main>
<footer class="pie"><span>Mapa MMA</span><a href="#guia">Guía</a><a href="#falta">Qué falta</a><a href="#copia">Copia de seguridad</a><a href="https://github.com/Sergiogonzalezruiz/MMA" target="_blank" rel="noopener">GitHub</a></footer>

<script src="datos-comun.js"></script>
<script src="datos-boxeo.js"></script>
<script src="datos-lucha.js"></script>
<script src="datos-suelo.js"></script>
<script src="pendientes.js"></script>
<script src="huecos-calc.js"></script>
<script src="guia.js"></script>
<script>
(() => {
const D = window.MMA;
const F = Object.fromEntries(D.FICHAS.map(f => [f.id, f]));
const S = Object.fromEntries(D.SECCIONES.map(s => [s.id, s]));
const P = Object.fromEntries(D.POSICIONES.map(p => [p.id, p]));
const FA = Object.fromEntries(D.FASES.map(f => [f.id, f]));
const JJ = Object.fromEntries(D.JJU.flatMap(p => p.caps.map(c => [c.id, { ...c, parte: p.parte }])));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const MMA_TXT = { "muy alta": "MMA ★★★", "alta": "MMA ★★", "media": "MMA ★", "baja": "MMA –" };
const SOLO_TXT = { si: "Solo en casa", parcial: "Solo: el patrón", no: "Con compañero" };
const GI_TXT = { ambos: "Gi y no-gi", gi: "Solo gi", nogi: "No-gi" };
const LADOS = { arriba: "Arriba", abajo: "Abajo", neutral: "" };
const CASA = ["esterilla", "goma", "cuerda", "pelota", "espejo", "comba", "cinta", "pared"];
const FUERA = ["saco", "companero", "tatami"];
const catName = f => f.tipo === "drill" ? "Drill" : (S[f.seccion].categorias.find(c => c.id === f.cat)?.n ?? f.cat);
const posLabel = (pos, lado) => `${P[pos]?.es ?? pos}${lado && LADOS[lado] ? " · " + LADOS[lado] : ""}`;
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const setSec = s => { if (s) document.body.dataset.sec = s; else delete document.body.dataset.sec; };

/* ---------- Progreso: se guarda solo en este navegador ---------- */
const CLAVE = "mapa-mma-progreso";
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const hoy = () => new Date().toISOString().slice(0, 10);
let progreso = leer(CLAVE, {});
const SIG = { nada: "entrenando", entrenando: "hecha", hecha: "nada" };
const estadoDe = id => progreso[id]?.e ?? "nada";
const txtEstado = (id, e = estadoDe(id)) => e === "nada" ? "Ni idea" : e === "entrenando" ? "Entrenando" : F[id]?.tipo === "drill" ? "Entrenado" : "Entrenada";
const ICO = {
  nada: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  entrenando: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>`,
  hecha: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
function setEstado(id, e) {
  if (e === "nada") delete progreso[id]; else progreso[id] = { e, t: hoy() };
  guardar(CLAVE, progreso);
  pintarEstados();
}
const fichasDe = k => { const [s, n] = k.split(":"); return D.FICHAS.filter(f => (s === "all" || f.seccion === s) && (!n || f.nivel === n)); };
function barra(lista) {
  const n = lista.length, h = lista.filter(f => estadoDe(f.id) === "hecha").length, e = lista.filter(f => estadoDe(f.id) === "entrenando").length;
  return `<div class="bar"><i class="h" style="width:${n ? h / n * 100 : 0}%"></i><i class="e" style="width:${n ? e / n * 100 : 0}%"></i></div>
    <small>${h} ${h === 1 ? "entrenada" : "entrenadas"} · ${e} entrenando · ${n - h - e} ni idea</small>`;
}
// Actualiza en la página todo lo que depende del progreso, sin volver a pintarla (el vídeo sigue sonando)
function pintarEstados() {
  $$("[data-mark]").forEach(b => {
    const id = b.dataset.mark, e = estadoDe(id), t = txtEstado(id, e);
    b.dataset.e = e;
    b.innerHTML = `${ICO[e]}<span>${t}</span>`;
    b.setAttribute("aria-label", `${F[id].es}: ${t}. Toca para cambiar a ${txtEstado(id, SIG[e])}`);
    b.title = `Toca para cambiar a ${txtEstado(id, SIG[e])}`;
  });
  $$(".fila").forEach(c => { c.dataset.e = estadoDe(c.dataset.id); });
  $$("[data-dot]").forEach(d => { d.dataset.e = estadoDe(d.dataset.dot); });
  $$("[data-set]").forEach(b => b.setAttribute("aria-pressed", estadoDe(b.dataset.id) === b.dataset.set));
  $$("[data-prog]").forEach(p => { p.innerHTML = barra(fichasDe(p.dataset.prog)); });
  $$("[data-cuenta]").forEach(s => {
    const k = s.dataset.cuenta, c = $$(".fila");
    s.textContent = k ? c.filter(x => x.dataset.e === k).length : c.length;
  });
}

/* ---------- Filtros de las listas ---------- */
const filtro = { e: "", solo: false };
const barraFiltros = () => `<div class="fbar">
    <div class="seg" role="group" aria-label="Filtrar por estado">${[["", "Todas"], ["nada", "Ni idea"], ["entrenando", "Entrenando"], ["hecha", "Entrenadas"]].map(([k, t]) => `<button type="button" data-fe="${k}" aria-pressed="${filtro.e === k}">${t} <span class="n" data-cuenta="${k}"></span></button>`).join("")}</div>
    <button class="btn" type="button" data-fsolo aria-pressed="${filtro.solo}">Solo en casa</button>
  </div><p class="vacio muted" id="fvacio" hidden>Nada con estos filtros. <a href="#" data-flimpiar>Quitar filtros</a></p>`;
function aplicarFiltros() {
  if (!$(".fbar")) return;
  $$("[data-fe]").forEach(b => b.setAttribute("aria-pressed", filtro.e === b.dataset.fe));
  $("[data-fsolo]").setAttribute("aria-pressed", filtro.solo);
  let vistas = 0;
  $$(".fila").forEach(c => {
    const ok = (!filtro.e || c.dataset.e === filtro.e) && (!filtro.solo || c.dataset.solo === "si");
    c.hidden = !ok; if (ok) vistas++;
  });
  $$(".section").forEach(s => { if (s.querySelector(".fila")) s.hidden = !s.querySelector(".fila:not([hidden])"); });
  $("#fvacio").hidden = vistas > 0;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-mark],[data-set],[data-fe],[data-fsolo],[data-flimpiar]");
  if (!t) return;
  if (t.dataset.mark) { e.preventDefault(); setEstado(t.dataset.mark, SIG[estadoDe(t.dataset.mark)]); return; }
  if (t.dataset.set) { setEstado(t.dataset.id, t.dataset.set); return; }
  if (t.dataset.fe !== undefined) filtro.e = t.dataset.fe;
  if (t.dataset.fsolo !== undefined) filtro.solo = !filtro.solo;
  if (t.dataset.flimpiar !== undefined) { e.preventDefault(); filtro.e = ""; filtro.solo = false; }
  aplicarFiltros();
});

/* ---------- Piezas ---------- */
const drillsDe = f => (f.drills || []).map(i => F[i]).filter(Boolean);
const tecnicasDe = d => D.FICHAS.filter(f => f.drills?.includes(d.id));
const dot = id => `<span class="dot" data-dot="${id}" aria-hidden="true"></span>`;
const nums = (g, big) => g?.length ? `<span class="nums${big ? " big" : ""}" aria-label="Golpes ${g.join("-")}">${g.map(n => `<span class="num">${n}</span>`).join("")}</span>` : "";
const chips = f => `<div class="chips">
  ${f.tipo === "drill" ? `<span class="chip acc">Drill</span>` : ""}

/* ---------- Grafo SVG genérico ---------- */
function grafo({ nodos, aristas, W = 220, H = 56, vb, label }) {
  const clip = (x, y, ux, uy) => { const s = Math.min((W / 2 + 4) / Math.abs(ux || 1e-9), (H / 2 + 4) / Math.abs(uy || 1e-9)); return [x + ux * s, y + uy * s]; };
  const set = new Set(aristas.map(([a, b]) => a + ">" + b));
  const edges = aristas.map(([a, b, title]) => {
    const A = nodos[a], B = nodos[b]; if (!A || !B) return "";
    const off = set.has(b + ">" + a) ? 9 : 0;
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const nx = -uy * off, ny = ux * off;
    const [sx, sy] = clip(A.x + nx, A.y + ny, ux, uy), [ex, ey] = clip(B.x + nx, B.y + ny, -ux, -uy);
    return `<path class="edge" d="M${sx},${sy} L${ex},${ey}" marker-end="url(#ah)">${title ? `<title>${esc(title)}</title>` : ""}</path>`;
  }).join("");
  const nodes = Object.entries(nodos).map(([id, n]) => `<g class="node ${n.pronto ? "pronto" : "link"}" ${n.pronto ? "" : `tabindex="0" role="link" data-go="${n.go}" aria-label="${esc(n.t)}"`}>
      <rect x="${n.x - W / 2}" y="${n.y - H / 2}" width="${W}" height="${H}" rx="8"/>
      ${n.color ? `<rect class="band" x="${n.x - W / 2 + 1}" y="${n.y - H / 2 + 1}" width="5" height="${H - 2}" rx="2" style="fill:${n.color}"/>` : ""}
      <text x="${n.x}" y="${n.y + (n.sub ? 0 : 6)}" text-anchor="middle">${esc(n.t)}</text>
      ${n.sub ? `<text class="cnt" x="${n.x}" y="${n.y + 18}" text-anchor="middle">${esc(n.sub)}</text>` : ""}</g>`).join("");
  return `<div class="mapbox"><svg viewBox="${vb}" role="img" aria-label="${esc(label)}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>
    ${edges}${nodes}</svg></div>`;
}

/* ---------- Mapa de suelo ---------- */
// Las posiciones tienen sitio fijo (campo mapa). Las técnicas las coloca una simulación con semilla: salen siempre en el mismo sitio.
const MN = { W: 1000, H: 680, PW: 168, PH: 50, ZOOM_NOMBRES: 0.8 };
const MN_CATS = ["escape", "guardia", "pase", "sumision", "mma"];
const mapa = { datos: null, sel: null, foco: null, vista: null, raf: 0, lado: "", cats: new Set(MN_CATS), lista: false, arrastrado: false };
const nombrePos = p => p.es.split(" y ")[0];
const posConLado = ({ pos, lado }) => `${nombrePos(P[pos])}${LADOS[lado] ? ` (${LADOS[lado].toLowerCase()})` : ""}`;
const catSuelo = c => S.suelo.categorias.find(x => x.id === c)?.n ?? c;
const fijarHash = h => { history.replaceState(null, "", "#" + h); pila[pila.length - 1] = h; };
const pararVideo = () => { try { player?.destroy?.(); } catch {} player = null; cur = null; };

function azar(a) {
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const semilla = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

function colocarTecnicas(fichas) {
  const obst = D.POSICIONES.filter(p => p.mapa).map(p => ({ x: p.mapa.x - MN.PW / 2, y: p.mapa.y - MN.PH / 2, w: MN.PW, h: MN.PH, cx: p.mapa.x, cy: p.mapa.y }));
  const cuantas = p => fichas.filter(f => f.desde.pos === p).length;
  const ns = fichas.map(f => {
    const a = P[f.desde.pos].mapa, b = f.hasta ? P[f.hasta.pos]?.mapa : null, r = azar(semilla(f.id)), ang = r() * Math.PI * 2;
    const w = 16 + f.es.length * 7, cx = b ? a.x + (b.x - a.x) * .25 + Math.cos(ang) * 40 : a.x + Math.cos(ang) * 130, cy = b ? a.y + (b.y - a.y) * .25 + Math.sin(ang) * 40 : a.y + Math.sin(ang) * 90;
    return { f, a, b, w, h: 22, x: cx + 9 - w / 2, y: cy, s: r() < .5 ? -1 : 1, largo: 90 + cuantas(f.desde.pos) * 14 };
  });
  const caja = n => ({ x: n.x - 9, y: n.y - n.h / 2, w: n.w, h: n.h });
  // El muelle tira del centro de punto y nombre, para que queden repartidos alrededor. Mide en elipse: los nombres son anchos
  const muelle = (n, c, largo, fuerza) => {
    const dx = c.x - (n.x - 9 + n.w / 2), dy = (c.y - n.y) * 2.2, d = Math.hypot(dx, dy) || 1, t = (d - largo) * fuerza;
    n.x += dx / d * t; n.y += dy / d * t;
  };
  // Separa una caja de otra por el eje en el que se solapan menos
  const choque = (n, o, m, reparto) => {
    const A = caja(n), B = o.f ? caja(o) : o;
    const px = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x) + m, py = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y) + m;
    if (px <= 0 || py <= 0) return false;
    const borde = Math.max(A.y + A.h, B.y + B.h) > MN.H - 6 || Math.min(A.y, B.y) < 6;
    if (py < px && !borde) { const s = A.y + A.h / 2 < B.y + B.h / 2 ? -1 : A.y + A.h / 2 > B.y + B.h / 2 ? 1 : n.s; n.y += s * py * reparto; if (o.f) o.y -= s * py * reparto; }
    else { const s = A.x + A.w / 2 < B.x + B.w / 2 ? -1 : A.x + A.w / 2 > B.x + B.w / 2 ? 1 : n.s; n.x += s * px * reparto; if (o.f) o.x -= s * px * reparto; }
    return true;
  };
  const dentro = n => { n.x = Math.max(12, Math.min(MN.W - n.w - 2, n.x)); n.y = Math.max(14, Math.min(MN.H - 14, n.y)); };
  const separar = () => {
    let hubo = false;
    ns.forEach((n, i) => {
      for (let j = i + 1; j < ns.length; j++) hubo = choque(n, ns[j], 3, .5) || hubo;
      obst.forEach(o => { hubo = choque(n, o, 6, 1) || hubo; });
      dentro(n);
    });
    return hubo;
  };
  for (let it = 0; it < 300; it++) {
    const al = 1 - it / 300;
    ns.forEach((n, i) => {
      for (let j = i + 1; j < ns.length; j++) {
        const m = ns[j], dx = n.x + n.w / 2 - m.x - m.w / 2, dy = n.y - m.y, d2 = Math.max(dx * dx + dy * dy, 25), t = 900 * al / d2;
        n.x += dx * t / 2; n.y += dy * t / 2; m.x -= dx * t / 2; m.y -= dy * t / 2;
      }
      muelle(n, n.a, n.largo, .07 * al + .015);
      if (n.b) muelle(n, n.b, 110, .006 * al);
    });
    if (it % 3 === 0) separar();
  }
  for (let it = 0; it < 150 && separar(); it++);
  return ns.map(({ f, x, y, w, h }) => ({ id: f.id, f, x: Math.round(x), y: Math.round(y), w, h }));
}

function datosMapa() {
  if (mapa.datos) return mapa.datos;
  const posiciones = D.POSICIONES.filter(p => p.mapa).sort((a, b) => a.mapa.y - b.mapa.y || a.mapa.x - b.mapa.x);
  const tecnicas = colocarTecnicas(D.FICHAS.filter(f => f.tipo === "tecnica" && P[f.desde?.pos]?.mapa));
  const nodos = new Map([...posiciones.map(p => ["p-" + p.id, { p }]), ...tecnicas.map(t => [t.id, { t }])]);
  const vecinos = new Map([...nodos.keys()].map(id => [id, new Set()]));
  const aristas = [];
  const une = (a, b, t, hacia) => { aristas.push({ a, b, t, hacia }); vecinos.get(a).add(b); vecinos.get(b).add(a); };
  tecnicas.forEach(t => {
    une("p-" + t.f.desde.pos, t.id, t);
    if (P[t.f.hasta?.pos]?.mapa) une(t.id, "p-" + t.f.hasta.pos, t, P[t.f.hasta.pos].mapa);
  });
  return mapa.datos = { posiciones, tecnicas, nodos, vecinos, aristas };
}

/* Dibujo */
function svgMapa() {
  const { posiciones, tecnicas, aristas } = datosMapa();
  const flecha = c => `<marker id="mnf-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="c-${c}" style="fill:var(--c)"/></marker>`;
  const linea = ({ a, b, t, hacia }) => {
    if (!hacia) { const o = P[t.f.desde.pos].mapa; return `<path class="e ep" data-a="${a}" data-b="${b}" data-t="${t.id}" d="M${o.x},${o.y} L${t.x},${t.y}"/>`; }
    const dx = hacia.x - t.x, dy = hacia.y - t.y, s = Math.min((MN.PW / 2 + 3) / Math.abs(dx || 1e-9), (MN.PH / 2 + 3) / Math.abs(dy || 1e-9));
    return `<path class="e eh c-${t.f.cat}" data-a="${a}" data-b="${b}" data-t="${t.id}" marker-end="url(#mnf-${t.f.cat})" d="M${t.x},${t.y} L${hacia.x - dx * s},${hacia.y - dy * s}"/>`;
  };
  const nodoT = t => `<g class="n t c-${t.f.cat}" data-id="${t.id}" tabindex="0" role="button" transform="translate(${t.x} ${t.y})"
      aria-label="${esc(`${t.f.es}. ${catSuelo(t.f.cat)}. Desde ${posConLado(t.f.desde)}${t.f.hasta ? `, hasta ${posConLado(t.f.hasta)}` : ""}`)}">
      <rect class="hit" x="-14" y="-14" width="${t.w + 8}" height="28"/><circle class="pt" r="7"/><text class="lbl" x="11" y="4">${esc(t.f.es)}</text></g>`;
  const nodoP = p => {
    const l = tecnicas.filter(t => t.f.desde.pos === p.id), { x, y } = p.mapa;
    return `<g class="n p${p.pronto || !l.length ? " vacia" : ""}" data-id="p-${p.id}" tabindex="0" role="button" transform="translate(${x} ${y})" aria-label="${esc(`Posición: ${nombrePos(p)}. ${l.length} técnicas`)}">
      <rect class="box" x="${-MN.PW / 2}" y="${-MN.PH / 2}" width="${MN.PW}" height="${MN.PH}" rx="8"/>
      <text class="nom" y="-2" text-anchor="middle">${esc(nombrePos(p))}</text><text class="cnt" y="15" text-anchor="middle">${l.length} ${l.length === 1 ? "técnica" : "técnicas"}</text></g>`;
  };
  return `<div class="mn-wrap"><svg class="mn" id="mnSvg" role="group" aria-label="Mapa de suelo: posiciones y técnicas">
      <defs>${MN_CATS.map(flecha).join("")}</defs>
      <g id="mnVista">${aristas.map(linea).join("")}${posiciones.map(p => nodoP(p) + tecnicas.filter(t => t.f.desde.pos === p.id).map(nodoT).join("")).join("")}</g></svg>
    <div class="mn-eje" aria-hidden="true">Más dominante para el de arriba →</div>

/* Vista: k son píxeles por unidad del lienzo */
function medidasMapa() { const r = $("#mnSvg").getBoundingClientRect(); return { w: r.width, h: r.height, fit: Math.min(r.width / MN.W, r.height / MN.H) }; }
function vistaInicial() {
  const { w, h, fit } = medidasMapa(), k = Math.min(1.3, Math.max(fit, MN.ZOOM_NOMBRES + .05));
  return { k, x: (w - MN.W * k) / 2, y: (h - MN.H * k) / 2, auto: true };
}
function limitarVista() {
  const v = mapa.vista, { w, h, fit } = medidasMapa();
  v.k = Math.max(fit * .9, Math.min(3, v.k));
  const eje = (t, lado, largo) => { const m = lado / 2, mitad = (lado - largo * v.k) / 2; return Math.max(Math.min(lado - largo * v.k - m, mitad), Math.min(t, Math.max(m, mitad))); };
  v.x = eje(v.x, w, MN.W); v.y = eje(v.y, h, MN.H);
}
function pintarVista() {
  const g = $("#mnVista"); if (!g) return;
  const { k, x, y } = mapa.vista, svg = $("#mnSvg");
  g.setAttribute("transform", `translate(${x} ${y}) scale(${k})`);
  svg.classList.toggle("lejos", k < MN.ZOOM_NOMBRES);
  svg.style.setProperty("--lbl", 12 / k + "px");
}
function zoomMapa(cx, cy, factor) {
  const v = mapa.vista, k0 = v.k; v.k *= factor; v.auto = false;
  limitarVista();
  v.x = cx - (cx - v.x) * v.k / k0; v.y = cy - (cy - v.y) * v.k / k0;
  limitarVista(); pintarVista();
}
function irVista(x, y, k, animar) {
  const v = mapa.vista; cancelAnimationFrame(mapa.raf);
  if (!animar || document.hidden || matchMedia("(prefers-reduced-motion:reduce)").matches) { Object.assign(v, { x, y, k }); limitarVista(); pintarVista(); return; }
  const a = { x: v.x, y: v.y, k: v.k }, t0 = performance.now();
  const paso = t => {
    const p = Math.min((t - t0) / 260, 1), e = 1 - (1 - p) ** 3;
    v.x = a.x + (x - a.x) * e; v.y = a.y + (y - a.y) * e; v.k = a.k + (k - a.k) * e;
    pintarVista();
    if (p < 1) mapa.raf = requestAnimationFrame(paso); else limitarVista();
  };
  mapa.raf = requestAnimationFrame(paso);
}
// Centra un nodo en la parte del mapa que no tapa el panel
function centrarNodo(id, animar) {
  const n = datosMapa().nodos.get(id), { x, y } = n.p ? n.p.mapa : n.t, { w, h } = medidasMapa(), v = mapa.vista, panel = $("#mnPanel");
  let cx = w / 2, cy = h / 2;
  if (panel && !panel.hidden) {
    const r = $("#mnSvg").getBoundingClientRect(), pr = panel.getBoundingClientRect();
    if (matchMedia("(max-width:860px)").matches) cy = Math.max(44, (pr.top - $(".top").offsetHeight) / 2);
    else cx = Math.max(100, Math.min(pr.left, r.right) - r.left) / 2;
  }
  v.auto = false;
  irVista(cx - x * v.k, cy - y * v.k, v.k, animar);
}

/* Resaltado y filtros: atenúan sin mover nada */

/* Interacción */
function activarSvgMapa() {
  const svg = $("#mnSvg"), ptrs = new Map();
  let recorrido = 0;
  const local = e => { const r = svg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  svg.addEventListener("wheel", e => { e.preventDefault(); const p = local(e); zoomMapa(p.x, p.y, Math.exp(-e.deltaY * .0015)); }, { passive: false });
  svg.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    ptrs.set(e.pointerId, local(e)); recorrido = 0; mapa.arrastrado = false;
    cancelAnimationFrame(mapa.raf);
  });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    const antes = ptrs.get(e.pointerId), ahora = local(e), v = mapa.vista;
    if (ptrs.size === 2) {
      const otro = [...ptrs].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(antes.x - otro.x, antes.y - otro.y) || 1, d1 = Math.hypot(ahora.x - otro.x, ahora.y - otro.y) || 1;
      mapa.arrastrado = true; v.auto = false;
      v.x += (ahora.x - antes.x) / 2; v.y += (ahora.y - antes.y) / 2;
      zoomMapa((ahora.x + otro.x) / 2, (ahora.y + otro.y) / 2, d1 / d0);
    } else {
      recorrido += Math.abs(ahora.x - antes.x) + Math.abs(ahora.y - antes.y);
      if (recorrido > 4) {
        if (!mapa.arrastrado) { mapa.arrastrado = true; mapa.foco = null; pintarFoco(); svg.classList.add("moviendo"); try { svg.setPointerCapture(e.pointerId); } catch {} }
        v.x += ahora.x - antes.x; v.y += ahora.y - antes.y; v.auto = false;
        limitarVista(); pintarVista();
      }
    }
    ptrs.set(e.pointerId, ahora);
  });
  const fin = e => { ptrs.delete(e.pointerId); if (!ptrs.size) svg.classList.remove("moviendo"); };
  svg.addEventListener("pointerup", fin);
  svg.addEventListener("pointercancel", fin);
  svg.addEventListener("click", e => {
    if (mapa.arrastrado) { mapa.arrastrado = false; return; }
    const n = e.target.closest(".n"); if (n) seleccionarNodo(n.dataset.id);
  });
  svg.addEventListener("keydown", e => {
    const n = e.target.closest(".n");
    if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); seleccionarNodo(n.dataset.id, { teclado: true }); }
  });
  svg.addEventListener("pointerover", e => {
    if (e.pointerType !== "mouse" || ptrs.size) return;
    mapa.foco = e.target.closest(".n")?.dataset.id ?? null; pintarFoco();
  });
  svg.addEventListener("pointerleave", () => { if (!ptrs.size) { mapa.foco = null; pintarFoco(); } });
  svg.addEventListener("focusin", e => {
    const n = e.target.closest(".n");
    if (!n?.matches(":focus-visible")) return;
    mapa.foco = n.dataset.id; pintarFoco();
    const r = svg.getBoundingClientRect(), b = n.getBoundingClientRect();
    if (b.left < r.left + 30 || b.right > r.right - 10 || b.top < r.top + 10 || b.bottom > r.bottom - 10) centrarNodo(n.dataset.id, true);
  });
  svg.addEventListener("focusout", () => { mapa.foco = null; pintarFoco(); });
  $(".mn-zoom").addEventListener("click", e => {
    const z = e.target.closest("[data-z]")?.dataset.z; if (!z) return;
    const { w, h } = medidasMapa();
    if (z === "centro") { const i = vistaInicial(); mapa.vista.auto = true; irVista(i.x, i.y, i.k, true); }
    else zoomMapa(w / 2, h / 2, z === "mas" ? 1.25 : .8);
  });
}
function pintarCuerpoMapa() {
  $("#mnCuerpo").innerHTML = mapa.lista ? listaMapa() : svgMapa();

}
document.addEventListener("keydown", e => {

/* ---------- Reproductor de YouTube ---------- */
let ytApi = null;
function loadYT() {
  if (ytApi) return ytApi;
  ytApi = new Promise((res, rej) => {
    if (window.YT?.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev?.(); res(window.YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => rej(new Error("api"));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error("timeout")), 8000);
  });
  ytApi.catch(() => { ytApi = null; });
  return ytApi;
}
const ytUrl = v => `https://www.youtube.com/watch?v=${v.id}${v.inicio ? "&t=" + v.inicio + "s" : ""}`;
function setCredit(v) {
  const c = $("#credit");
  if (c) c.innerHTML = `${v.verificado ? "" : `<a class="unrev" href="#guia-videos" title="Todavía no lo has revisado">Sin revisar</a> `}${esc(v.instructor || "")}${v.canal && v.canal !== v.instructor ? " · " + esc(v.canal) : ""}${v.idioma === "es" ? " · en español" : ""} · <a href="${ytUrl(v)}" target="_blank" rel="noopener">Abrir en YouTube</a>`;
}
async function mountPlayer(v) {
  cur = v; setCredit(v);
  const box = $("#player"); if (!box) return;
  try { player?.destroy?.(); } catch {}
  player = null;
  box.innerHTML = `<div id="yt"></div>`;
  try {
    const YT = await loadYT();
    if (cur !== v || !document.getElementById("yt")) return;
    const pv = { rel: 0, playsinline: 1, modestbranding: 1, start: v.inicio || 0 };
    if (v.fin) pv.end = v.fin;
    if (location.protocol.startsWith("http")) pv.origin = location.origin;
    player = new YT.Player("yt", {
      host: "https://www.youtube-nocookie.com",
      videoId: v.id, playerVars: pv,
      events: {
        onReady: e => { try { e.target.setPlaybackRate(rate); } catch {} },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED && loop && cur) e.target.loadVideoById({ videoId: cur.id, startSeconds: cur.inicio || 0, ...(cur.fin ? { endSeconds: cur.fin } : {}) });
          if (e.data === YT.PlayerState.PLAYING) { try { e.target.setPlaybackRate(rate); } catch {} }
        },
        onError: e => showError(v, e.data)
      }
    });
  } catch {
    const q = new URLSearchParams({ rel: 0, playsinline: 1, start: v.inicio || 0 });
    if (v.fin) q.set("end", v.fin);
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?${q}" title="Vídeo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  }
}
function playSegment(v) {
  cur = v;
  if (player?.loadVideoById) { player.loadVideoById({ videoId: v.id, startSeconds: v.inicio || 0, ...(v.fin ? { endSeconds: v.fin } : {}) }); setCredit(v); }
  else mountPlayer(v);
}
function showError(v, code) {
  const box = $("#player"); if (!box) return;
  const why = code === 101 || code === 150 || code === 153 ? "El canal no deja ver este vídeo fuera de YouTube."
    : code === 100 ? "Este vídeo ya no existe o es privado." : "YouTube no ha podido cargar el vídeo.";
  box.innerHTML = `<div class="vmsg"><strong>${why}</strong><a href="${ytUrl(v)}" target="_blank" rel="noopener">Verlo en YouTube</a><small>Código ${code}. Prueba otro vídeo de la ficha o cámbialo en los datos.</small></div>`;
}

const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const idx = [
  ...D.FICHAS.map(f => ({ id: f.id, href: "#f-" + f.id, title: f.es, sub: `${S[f.seccion].nombre} · ${catName(f)}`, hay: norm([f.es, f.en, f.jp, f.pt, ...(f.alias || [])].join(" ")) })),
  ...D.POSICIONES.filter(p => !p.pronto && p.lados && p.id !== "base").map(p => ({ href: "#p-" + p.id, title: p.es, sub: "Suelo · Posición", hay: norm([p.es, p.en, p.pt].join(" ")) })),
  ...D.FASES.map(f => ({ href: "#fase-" + f.id, title: f.n, sub: "Fase del combate", hay: norm(f.n) })),
  ...(D.GUIA || []).map(g => ({ href: "#guia-" + g.id, title: g.t, sub: "Guía", hay: norm(g.t + " " + g.r) })),
  { href: "#suelo-mapa", title: "Mapa de suelo", sub: "Suelo · Posiciones y técnicas", hay: norm("mapa de suelo posiciones") },
  { href: "#falta", title: "Qué falta", sub: "Guía · pendientes y huecos", hay: norm("que falta pendientes huecos tanda") }
];
const q = $("#q"), res = $("#results");
let sel = 0, hits = [];
function drawResults() {
  res.innerHTML = hits.length ? hits.map((h, i) => `<a href="${h.href}" class="${i === sel ? "sel" : ""}">${h.id ? `<span class="dot" data-e="${estadoDe(h.id)}" aria-hidden="true"></span>` : ""}${esc(h.title)}<br><small>${esc(h.sub)}</small></a>`).join("") : `<div style="padding:8px 10px;color:var(--muted)">Nada con ese nombre todavía.</div>`;
  res.hidden = false;
}
q.addEventListener("input", () => {
  const s = norm(q.value.trim());
  if (!s) { res.hidden = true; return; }
  hits = idx.filter(i => s.split(/\s+/).every(w => i.hay.includes(w))).slice(0, 10); sel = 0; drawResults();
});
q.addEventListener("keydown", e => {
  if (res.hidden) return;
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); drawResults(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); drawResults(); e.preventDefault(); }
  if (e.key === "Enter" && hits[sel]) { location.hash = hits[sel].href; closeSearch(); }
  if (e.key === "Escape") closeSearch();
});
res.addEventListener("click", closeSearch);
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });
function closeSearch() { res.hidden = true; q.value = ""; q.blur(); }
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

/* ---------- Tema ---------- */
$("#tema").addEventListener("click", () => {
  const raiz = document.documentElement;
  const actual = raiz.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  raiz.dataset.theme = actual === "dark" ? "light" : "dark";
  guardar("mapa-mma-tema", raiz.dataset.theme);
});

/* ---------- Rutas ---------- */
// Al volver atrás recupera la posición de la lista en vez de subir arriba del todo
const pila = [], scrolls = {};
function route() {
  let h = decodeURIComponent(location.hash.slice(1)) || "inicio";
  if (h === "suelo-posiciones") { h = "suelo-mapa"; history.replaceState(null, "", "#suelo-mapa"); }
  if (pila.length) scrolls[pila.at(-1)] = window.scrollY;
  const atras = pila.at(-2) === h;
  if (atras) pila.pop(); else if (pila.at(-1) !== h) pila.push(h);
  try { player?.destroy?.(); } catch {} player = null; cur = null;
  let navOn = null;
  const m = h.match(/^(boxeo|lucha|suelo)(?:-(entrenar|ruta))?$/);
  if (m) { renderSeccion(m[1], m[2] || "tecnicas"); navOn = m[1]; }
  else if (h === "suelo-mapa" || h.startsWith("suelo-mapa/")) { renderSeccion("suelo", "mapa", h.slice(11) || null); navOn = "suelo"; }
  else if (h.startsWith("f-")) { renderFicha(h.slice(2)); navOn = F[h.slice(2)]?.seccion; }
  else if (h.startsWith("p-")) { renderPos(h.slice(2)); navOn = "suelo"; }
  else if (h.startsWith("fase-")) renderFase(h.slice(5));
  else if (h === "plan") { renderPlan(); navOn = "plan"; }
  else if (h === "copia") renderCopia();
  else if (h === "guia") renderGuia(null);
  else if (h.startsWith("guia-")) renderGuia(h.slice(5));
  else if (h === "falta") renderFalta();
  else { renderInicio(); navOn = "inicio"; }
  pintarEstados(); aplicarFiltros();
  $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.s === navOn));
  window.scrollTo(0, atras ? scrolls[h] || 0 : 0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
